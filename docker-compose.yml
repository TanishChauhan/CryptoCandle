name: crypto-etl

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [crypto-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks: [crypto-net]

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks: [crypto-net]

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto_secret}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_analytics}
    volumes:
      - ./infra/postgres/init-airflow-db.sh:/docker-entrypoint-initdb.d/00-init-airflow-db.sh:ro
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/postgres/init.sql:/schema/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [crypto-net]

  producer:
    build:
      context: .
      dockerfile: services/producer/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: unless-stopped
    networks: [crypto-net]

  spark-streaming:
    build:
      context: .
      dockerfile: services/spark_streaming/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
    restart: unless-stopped
    networks: [crypto-net]

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile.init
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://crypto:crypto_secret@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__LAZY_LOAD_PLUGINS: "true"
      AIRFLOW__CORE__LAZY_DISCOVER_PROVIDERS: "true"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow/project
      RAW_DATA_DIR: /data/raw/trades
      RAW_DATA_COMPACTED_DIR: /data/raw/trades_compacted
    volumes:
      - ./services:/opt/airflow/project/services
      - ./shared:/opt/airflow/project/shared
      - ./pyproject.toml:/opt/airflow/project/pyproject.toml
      - ${HOST_DATA_DIR:-./data}:/data
    entrypoint: /bin/bash
    command:
      [
        "-c",
        "timeout 60 airflow db migrate; airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true",
      ]
    networks: [crypto-net]

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile.webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://crypto:crypto_secret@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__LAZY_LOAD_PLUGINS: "true"
      AIRFLOW__CORE__LAZY_DISCOVER_PROVIDERS: "true"
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: "6000"
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports: ["8081:8080"]
    command: webserver
    restart: unless-stopped
    networks: [crypto-net]

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://crypto:crypto_secret@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project
      RAW_DATA_DIR: /data/raw/trades
      RAW_DATA_COMPACTED_DIR: /data/raw/trades_compacted
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./services:/opt/airflow/project/services
      - ./shared:/opt/airflow/project/shared
      - ./pyproject.toml:/opt/airflow/project/pyproject.toml
      - ${HOST_DATA_DIR:-./data}:/data
    command: scheduler
    networks: [crypto-net]

  postgres-schema:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/postgres/init.sql:/init.sql:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-crypto_secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -h postgres -U ${POSTGRES_USER:-crypto} -d ${POSTGRES_DB:-crypto_analytics}
        -v ON_ERROR_STOP=1 -f /init.sql
    networks: [crypto-net]

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    depends_on:
      postgres-schema:
        condition: service_completed_successfully
    env_file: .env
    ports: ["8501:8501"]
    volumes:
      - ./dashboard:/app/dashboard
      - ./debug-6be8fb.log:/app/debug-6be8fb.log
    networks: [crypto-net]

networks:
  crypto-net:
    driver: bridge

volumes:
  postgres_data:
