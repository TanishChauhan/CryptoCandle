# Spark Structured Streaming defaults for local Docker MVP
# (Copied into spark-streaming container at build time later.)

spark.sql.shuffle.partitions  = 4

# Streaming safety
spark.sql.streaming.stateStore.providerClass=org.apache.spark.sql.streaming.state.HDFSBackedStateStoreProvider

# Kafka settings will be passed via env/args; this file focuses on Spark behavior.
