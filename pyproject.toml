[project]
name = "crypto-codebase-etl"
version = "0.1.0"
description = "Hybrid batch + streaming crypto analytics ETL on Binance market data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6",
    "structlog>=24.1",
    "confluent-kafka>=2.3",
    "websockets>=12.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3"]
spark = ["pyspark>=3.5.0"]
dashboard = ["streamlit>=1.32", "plotly>=5.20", "pandas>=2.2", "psycopg2-binary>=2.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"